<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네트워크 게시판 - 류재정 포트폴리오</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">RYU JAE JEONG</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="class.html">Class</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="board.html">Board</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section>
        <header class="section-header reveal">
            <span class="step-label">Guest Interaction</span>
            <h2>자유게시판</h2>
            <p class="sub-text" style="text-align:center;">
                Firebase Realtime Database 기반 온라인 게시판입니다.<br>
                글쓰기, 상세보기, 수정, 삭제, 댓글, 좋아요 기능을 사용할 수 있습니다.
            </p>
        </header>

        <div class="card reveal">
            <table class="board-table">
                <thead>
                    <tr>
                        <th style="width: 80px;">번호</th>
                        <th>제목</th>
                        <th style="width: 140px;">작성자</th>
                        <th style="width: 140px;">날짜</th>
                        <th style="width: 100px;">좋아요</th>
                    </tr>
                </thead>
                <tbody id="board-list">
                    <tr>
                        <td colspan="5" style="text-align:center; padding:20px;">
                            데이터를 불러오는 중입니다...
                        </td>
                    </tr>
                </tbody>
            </table>

            <div class="board-actions" style="margin-top: 1.5rem; display:flex; gap: 0.75rem; flex-wrap: wrap;">
                <button class="btn btn-primary" type="button" onclick="toggleForm()">글쓰기</button>
                <button class="btn btn-secondary" type="button" onclick="loadPosts()">새로고침</button>
            </div>
        </div>

        <div id="write-form" class="card" style="display:none; margin-top: 2rem;">
            <h3 style="margin-bottom: 1rem;">새 게시글 작성</h3>
            <div class="form-group">
                <input type="text" id="title" placeholder="제목을 입력하세요" class="input-field">
                <input type="text" id="author" placeholder="작성자 명" class="input-field">
                <textarea id="content" placeholder="내용을 입력하세요" class="input-field" rows="8"></textarea>
                <input type="password" id="pwd" placeholder="수정/삭제용 비밀번호" class="input-field">
                <div class="form-footer" style="display:flex; gap: 0.75rem; flex-wrap: wrap;">
                    <button class="btn btn-primary" type="button" onclick="submitPost()">등록하기</button>
                    <button class="btn btn-secondary" type="button" onclick="toggleForm()">닫기</button>
                </div>
            </div>
        </div>

        <div id="post-detail" class="card" style="display:none; margin-top: 2rem;">
            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:1rem; flex-wrap:wrap;">
                <div>
                    <h3 id="detail-title" style="margin-bottom:0.5rem;"></h3>
                    <p id="detail-meta" style="color:#666; margin-bottom:1rem;"></p>
                </div>
                <div style="display:flex; gap:0.5rem; flex-wrap:wrap;">
                    <button class="btn btn-primary" type="button" onclick="likeCurrentPost()">좋아요</button>
                    <button class="btn btn-secondary" type="button" onclick="openEditModal()">수정</button>
                    <button class="btn btn-secondary" type="button" onclick="promptDeletePost()">삭제</button>
                    <button class="btn btn-secondary" type="button" onclick="closePostDetail()">닫기</button>
                </div>
            </div>

            <div id="detail-content" style="white-space:pre-wrap; line-height:1.8; margin:1rem 0 2rem;"></div>

            <hr style="border:none; border-top:1px solid #e5e7eb; margin: 1.5rem 0;">

            <h4 style="margin-bottom:1rem;">댓글</h4>
            <div id="comment-list" style="margin-bottom:1rem;">
                댓글을 불러오는 중입니다...
            </div>

            <div class="form-group">
                <input type="text" id="comment-author" placeholder="댓글 작성자" class="input-field">
                <textarea id="comment-content" placeholder="댓글 내용을 입력하세요" class="input-field" rows="4"></textarea>
                <button class="btn btn-primary" type="button" onclick="submitComment()">댓글 등록</button>
            </div>
        </div>

        <!-- reveal 제거 -->
        <div id="edit-modal" class="card" style="display:none; margin-top: 2rem;">
            <h3 style="margin-bottom:1rem;">게시글 수정</h3>
            <input type="text" id="edit-title" class="input-field" placeholder="제목">
            <input type="text" id="edit-author" class="input-field" placeholder="작성자">
            <textarea id="edit-content" class="input-field" rows="10" placeholder="내용"></textarea>
            <input type="password" id="edit-pwd" class="input-field" placeholder="비밀번호 확인">
            <div style="display:flex; gap:0.75rem; flex-wrap:wrap;">
                <button class="btn btn-primary" type="button" onclick="saveEditedPost()">수정 저장</button>
                <button class="btn btn-secondary" type="button" onclick="closeEditModal()">취소</button>
            </div>
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
