<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>네트워크 게시판 - 류재정 포트폴리오</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav>
        <a href="index.html" class="logo">RYU JAE JEONG</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="projects.html">Projects</a></li>
            <li><a href="class.html">Class</a></li>
            <li><a href="history.html">History</a></li>
            <li><a href="board.html">Board</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <section>
        <header class="section-header reveal">
            <span class="step-label">Guest Interaction</span>
            <h2>자유게시판</h2>
            <p>전 세계 어디서든 실시간으로 의견을 남길 수 있는 Firebase 연동 게시판입니다.</p>
        </header>

        <div class="card reveal">
            <table class="board-table">
                <thead>
                    <tr>
                        <th>번호</th>
                        <th>제목</th>
                        <th>작성자</th>
                        <th>날짜</th>
                    </tr>
                </thead>
                <tbody id="board-list">
                    <tr>
                        <td colspan="4" style="text-align:center; padding:20px;">데이터를 불러오는 중입니다...</td>
                    </tr>
                </tbody>
            </table>
            <div class="board-actions">
                <button class="btn btn-primary" onclick="toggleForm()">글쓰기</button>
            </div>
        </div>

        <div id="write-form" class="card write-card reveal" style="display: none;">
            <h3>새 게시글 작성</h3>
            <div class="form-group">
                <input type="text" id="title" placeholder="제목을 입력하세요" class="input-field">
                <input type="text" id="author" placeholder="작성자 명" class="input-field">
                <textarea id="content" placeholder="내용을 입력하세요" class="input-field" rows="5"></textarea>
                <div class="form-footer">
                    <button class="btn btn-primary" onclick="submitPost()">등록하기</button>
                    <button class="btn" style="background:#ccc;" onclick="toggleForm()">취소</button>
                </div>
            </div>
        </div>
    </section>

    <script type="module" src="script.js"></script>
</body>
</html>
